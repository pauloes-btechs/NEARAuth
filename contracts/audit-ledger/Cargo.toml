[package]
name = "nearauth-audit-ledger"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "NEARAuth audit ledger: stores Merkle roots of audit-event commitments. Never stores personal data."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
